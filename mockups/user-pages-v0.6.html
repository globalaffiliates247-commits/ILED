<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ILED · Mockup trang người dùng v0.6</title>
<style>
:root{--red:#C8102E;--red-dk:#7F0B1F;--ink:#1d2433;--muted:#6b7385;--line:#ececee;--paper:#f7f7f8}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#eceef2;color:var(--ink);font-size:14px}
.page{max-width:1100px;margin:0 auto;padding:24px 16px}
h1{font-size:18px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin-bottom:16px}
.tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.tabs button{border:1px solid #d9dbe1;background:#fff;padding:8px 14px;border-radius:999px;cursor:pointer;font:inherit;color:var(--ink)}
.tabs button.on{background:var(--red);border-color:var(--red);color:#fff}
.stage{display:flex;justify-content:center}
.phone{background:#111827;border-radius:36px;padding:12px;width:375px;box-shadow:0 20px 40px rgba(15,23,42,.25)}
.screen{background:var(--paper);border-radius:26px;overflow:hidden;height:720px;overflow-y:auto}
.caption{text-align:center;color:var(--muted);font-size:12px;margin-top:10px}
.hidden{display:none!important}
.seal{width:64px;height:64px;border-radius:50%;background:#fff;padding:4px;object-fit:contain;display:block;margin:0 auto 16px}

/* ----- phone virtual card ----- */
.card-screen{min-height:100%;background:linear-gradient(#f3f3f5,#e6e6ea);padding:28px 16px;display:grid;place-items:start center}
.vcard{width:100%;border-radius:22px;background:linear-gradient(160deg,var(--red) 0%,var(--red-dk) 100%);color:#fff;padding:24px 20px 22px;text-align:center;box-shadow:0 12px 30px rgba(127,11,31,.35)}
.v-title{opacity:.85;font-size:13px}
.v-name{font-size:22px;font-weight:700;margin-top:2px}
.v-pos{opacity:.9;margin-bottom:16px}
.qrbox{background:#fff;border-radius:14px;padding:12px;display:inline-block}
.qrbox svg{display:block;width:190px;height:190px}
.v-id{font-size:12px;opacity:.85;margin-top:12px;letter-spacing:.6px}
.v-hint{font-size:12px;opacity:.8;margin:4px 0 16px}
.btn-light{background:#fff;color:var(--red);border-radius:10px;padding:10px 30px;font-weight:700;text-decoration:none;display:inline-block}

/* ----- public page ----- */
.pub-screen{min-height:100%;background:var(--paper)}
.pub-head{background:var(--red);padding:18px 16px 40px;display:flex;justify-content:space-between;align-items:center}
.pub-head img{width:56px;height:56px;border-radius:50%;background:#fff;padding:3px;object-fit:contain}
.lang{font-size:12px;color:#fff;opacity:.9}
.pub-body{padding:0 14px 18px;margin-top:-28px}
.pub-card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 6px 18px rgba(15,23,42,.08);border-top:4px solid var(--red)}
.pub-title{color:var(--muted);font-size:13px}
.pub-name{margin:4px 0 2px;font-size:22px}
.pub-pos{color:var(--muted);margin-bottom:12px}
.row{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line);font-size:14px;gap:12px}
.row span{color:var(--muted)}
.badge{padding:5px 12px;border-radius:999px;font-size:12px;font-weight:700;display:inline-block;margin-top:14px}
.b-active{background:var(--red);color:#fff}
.qr-block{background:#fff;border-radius:18px;padding:16px;margin-top:12px;display:flex;align-items:center;gap:14px;box-shadow:0 6px 18px rgba(15,23,42,.06)}
.qr-block .qrbox{padding:6px;border-radius:10px;flex:none}
.qr-block .qrbox svg{width:96px;height:96px}
.qr-block .t{font-size:13px;font-weight:700}
.qr-block .s{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.45}
.hint{font-size:12px;color:var(--muted);margin:14px 4px 0;line-height:1.5}
.avatar{width:104px;height:104px;border-radius:50%;object-fit:cover;border:4px solid #fff;display:block;margin:0 auto 12px;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.avatar.initials{background:#fff;color:var(--red);display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800}
.v-extra{font-size:13px;font-weight:600;background:rgba(255,255,255,.16);border-radius:10px;padding:7px 12px;margin:-6px 0 16px;line-height:1.4}
</style>
</head>
<body>
<div class="page">
  <h1>Mockup trang người dùng · ILED</h1>
  <div class="sub">Thẻ điện thoại và trang khi quét QR của từng cộng tác viên. Dữ liệu mẫu, chưa có backend.</div>

  <div class="stage"><div id="view"></div></div>
  <div class="caption" id="caption"></div>

const initialsOf = name => { const w = name.trim().split(/\s+/); return (w[0][0] + w[w.length-1][0]).toUpperCase(); };
const avatarHTML = (p, size) => {
  const st = `width:${size}px;height:${size}px;${size < 90 ? 'margin:0 0 10px;border-width:3px;' : ''}${p.avatar ? '' : `font-size:${Math.round(size*0.32)}px;`}`;
  return p.avatar
    ? `<img class="avatar" src="${p.avatar}" alt="${p.name}" style="${st}">`
    : `<div class="avatar initials" style="${st}">${initialsOf(p.name)}</div>`;
};
const qrSVG = () => `<svg viewBox="0 0 31 31" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges"><rect width="31" height="31" fill="#fff"/><path d="${QR_PATH}" fill="${QR_COLOR}"/></svg>`;

function renderCard(p){
  return `<div class="phone"><div class="screen"><div class="card-screen"><div class="vcard">
    <img class="seal" src="iled-logo.png" alt="Viện ILED">
    ${avatarHTML(p, 104)}
    <div class="v-title">${p.title}</div>
    <div class="v-name">${p.name}</div>
    <div class="v-pos">${p.position}</div>
    ${p.extra ? `<div class="v-extra">${p.extra}</div>` : ''}
    <div class="qrbox">${qrSVG()}</div>
    <div class="v-id">${p.id}</div>
    <div class="v-hint">Quét mã QR để xem thông tin</div>
    <a class="btn-light" href="#" data-goto="${p.id}">Xem</a>
  </div></div></div></div>`;
}

function renderPub(p){
  const badge = p.active
    ? '<span class="badge b-active">Đang hợp tác với ILED</span>'
    : '<span class="badge" style="background:#e5e7eb;color:#374151">Không còn hợp tác với ILED</span>';
  return `<div class="phone"><div class="screen"><div class="pub-screen">
    <div class="pub-head"><img src="iled-logo.png" alt="Viện ILED"><div class="lang">VI · EN</div></div>
    <div class="pub-body">
      <div class="pub-card">
        ${avatarHTML(p, 80)}
        <div class="pub-title">${p.title}</div>
        <h2 class="pub-name">${p.name}</h2>
        <div class="pub-pos">${p.position}</div>
        <div class="row"><span>Mã ILED</span><b>${p.id}</b></div>
        <div class="row"><span>Từ ngày</span><b>${p.start}</b></div>
        <div class="row"><span>Hiệu lực đến</span><b>${p.end}</b></div>
        ${badge}
      </div>
      <div class="qr-block">
        <div class="qrbox">${qrSVG()}</div>
        <div>
          <div class="t">Mã QR của hồ sơ này</div>
          <div class="s">Chia sẻ trang này bằng cách cho người khác quét mã.</div>
        </div>
      </div>
      <p class="hint">Thông tin được hệ thống ILED cập nhật tự động.</p>
    </div>
  </div></div></div>`;
}

const VIEWS = [];
PEOPLE.forEach(p => {
  VIEWS.push({ key:'card-'+p.id, label:'Thẻ điện thoại · '+p.name, html:()=>renderCard(p), caption:'Thẻ trên điện thoại · nút “Xem” mở trang công khai' });
  VIEWS.push({ key:'pub-'+p.id,  label:'Trang khi quét QR · '+p.name, html:()=>renderPub(p), caption:'Người quét QR thấy thông tin công khai, không có email hay số điện thoại' });
});

let current = VIEWS[0].key;
function show(key){
  current = key;
  const v = VIEWS.find(x => x.key === key);
  document.getElementById('view').innerHTML = v.html();
  document.getElementById('caption').textContent = v.caption;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.key === key));
}
document.getElementById('tabs').innerHTML = VIEWS.map(v => `<button data-key="${v.key}">${v.label}</button>`).join('');
document.getElementById('tabs').onclick = e => { const b = e.target.closest('button'); if (b) show(b.dataset.key); };
document.getElementById('view').onclick = e => {
  const a = e.target.closest('[data-goto]');
  if (!a) return;
  e.preventDefault();
  show('pub-' + a.dataset.goto);
};
show(current);
</script>
</body>
